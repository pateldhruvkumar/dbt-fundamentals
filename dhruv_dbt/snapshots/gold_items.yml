snapshots:
  - name: gold_items
    relation: ref('source_gold_items') # source('my_source', 'my_table') or ref('my_model')
    config:
      database: dbt-tutorial
      schema: gold
      unique_key: id
      strategy: timestamp
      updated_at: updateDate
      dbt_valid_to_current: "to_date('9999-12-31')"